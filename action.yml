name: Universal Portable Release Publisher
description: Publish portable ZIPs and PortableApps .paf.exe installers to Releases in the calling repository.
inputs:
  files:
    description: "Semicolon/newline-separated globs for finished .zip and/or .paf.exe packages."
    required: true
  tag:
    description: "Stable release tag, e.g. portable-v1.2.3-r1. Must begin with tag-prefix."
    required: true
  release-title:
    description: "Friendly release name (defaults to tag)."
    required: false
    default: ''
  tag-prefix:
    description: "Reserved prefix for publisher-owned release tags."
    required: false
    default: 'portable-'
  keep-releases:
    description: "Number of recent mutable publisher-managed releases to keep if prune=true."
    required: false
    default: '3'
  prune:
    description: "Opt-in cleanup of older mutable publisher-managed releases; defaults off."
    required: false
    default: 'false'
  dry-run:
    description: "Preview selected files and checksum without uploading or deleting."
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Validate and publish portable ZIP or PAF installer
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_REPO: ${{ github.repository }}
        SOURCE_SHA: ${{ github.sha }}
        WORKSPACE_ROOT: ${{ github.workspace }}
        ACTION_EVENT: ${{ github.event_name }}
        ACTION_RUN_ID: ${{ github.run_id }}
        PUBLISH_FILES: ${{ inputs.files }}
        PUBLISH_TAG: ${{ inputs.tag }}
        PUBLISH_TITLE: ${{ inputs['release-title'] }}
        PUBLISH_PREFIX: ${{ inputs['tag-prefix'] }}
        PUBLISH_KEEP: ${{ inputs['keep-releases'] }}
        PUBLISH_PRUNE: ${{ inputs.prune }}
        PUBLISH_DRY_RUN: ${{ inputs['dry-run'] }}
      run: python "$GITHUB_ACTION_PATH/scripts/publish.py"
